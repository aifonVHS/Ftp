<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Deck BIOS — Анализ прошивки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0c10;
    --panel: #111318;
    --border: #1e2330;
    --accent: #4af0b0;
    --accent2: #6a8fff;
    --warn: #ffb347;
    --danger: #ff5566;
    --text: #c8d0e0;
    --muted: #5a6278;
    --green: #3ddc97;
    --purple: #b48fff;
    --teal: #4fc3c3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0d1117 0%, #0a1428 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  header h1 span { color: var(--accent2); }

  .subtitle {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
  }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

  .controls {
    padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--bg);
    position: sticky;
    top: 97px;
    z-index: 99;
  }

  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    width: 280px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .filter-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(74,240,176,0.08);
  }

  .main { padding: 24px 40px; max-width: 1600px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
    gap: 16px;
  }

  .module-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .module-card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .module-card.hidden { display: none; }

  .card-header {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .card-header:hover { background: rgba(255,255,255,0.02); }

  .module-addr {
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .module-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .func-count {
    background: rgba(106,143,255,0.15);
    border: 1px solid rgba(106,143,255,0.3);
    color: var(--accent2);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 18px 0; }

  .tag {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 4px;
    letter-spacing: 0.3px;
    font-weight: 700;
    text-transform: uppercase;
    border: 1px solid;
  }

  .tag-pci { color: #ff9f7a; border-color: rgba(255,159,122,0.4); background: rgba(255,159,122,0.1); }
  .tag-usb { color: #74d7ff; border-color: rgba(116,215,255,0.4); background: rgba(116,215,255,0.1); }
  .tag-net { color: #6a8fff; border-color: rgba(106,143,255,0.4); background: rgba(106,143,255,0.1); }
  .tag-sec { color: #ff5566; border-color: rgba(255,85,102,0.4); background: rgba(255,85,102,0.1); }
  .tag-pm  { color: #ffb347; border-color: rgba(255,179,71,0.4); background: rgba(255,179,71,0.1); }
  .tag-stor { color: #4af0b0; border-color: rgba(74,240,176,0.4); background: rgba(74,240,176,0.1); }
  .tag-boot { color: #b48fff; border-color: rgba(180,143,255,0.4); background: rgba(180,143,255,0.1); }
  .tag-amd { color: #e8463c; border-color: rgba(232,70,60,0.4); background: rgba(232,70,60,0.1); }
  .tag-ui  { color: #ffd166; border-color: rgba(255,209,102,0.4); background: rgba(255,209,102,0.1); }
  .tag-tpm { color: #06d6a0; border-color: rgba(6,214,160,0.4); background: rgba(6,214,160,0.1); }
  .tag-fw  { color: #caf0f8; border-color: rgba(202,240,248,0.4); background: rgba(202,240,248,0.1); }
  .tag-misc { color: var(--muted); border-color: rgba(90,98,120,0.4); background: rgba(90,98,120,0.1); }

  .card-body {
    padding: 14px 18px 16px;
    display: none;
  }
  .card-body.open { display: block; }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 12px;
  }
  .section-title:first-child { margin-top: 0; }

  .desc-text {
    color: var(--text);
    font-size: 12px;
    line-height: 1.7;
    border-left: 2px solid var(--border);
    padding-left: 12px;
    margin-bottom: 12px;
  }

  .func-list { display: flex; flex-direction: column; gap: 4px; }

  .func-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 6px 10px;
    border-radius: 5px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .func-item:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }

  .func-addr {
    color: var(--accent2);
    font-size: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 1px;
    font-weight: 700;
  }

  .func-info { flex: 1; min-width: 0; }

  .func-sig {
    color: var(--accent);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }

  .func-hints {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
    margin-top: 2px;
  }

  .func-size {
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: right;
    padding-top: 1px;
  }

  .toggle-icon { color: var(--muted); font-size: 14px; transition: transform 0.2s; flex-shrink: 0; }
  .card-header.open .toggle-icon { transform: rotate(90deg); }

  .chevron { color: var(--muted); font-size: 10px; }

  .section-sep {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }

  .no-results {
    text-align: center;
    color: var(--muted);
    padding: 60px;
    font-size: 14px;
    display: none;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .highlight { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="module-addr">VOLUME: EFI_FIRMWARE_FILE_SYSTEM2_GUID</div>
  <h1>Steam Deck <span>BIOS</span> — Полный анализ</h1>
  <div class="subtitle">Декомпиляция Ghidra · AMD Van Gogh SoC · UEFI/AMI Aptio</div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-val">12 403</div><div class="stat-label">Функций</div></div>
    <div class="stat"><div class="stat-val">842 000+</div><div class="stat-label">Строк кода</div></div>
    <div class="stat"><div class="stat-val">130+</div><div class="stat-label">Модулей (DXE)</div></div>
    <div class="stat"><div class="stat-val">~18 МБ</div><div class="stat-label">Размер тома</div></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍  Поиск по модулям и функциям...">
  <button class="filter-btn active" data-filter="all">Все</button>
  <button class="filter-btn" data-filter="sec">SecureBoot</button>
  <button class="filter-btn" data-filter="amd">AMD/AGESA</button>
  <button class="filter-btn" data-filter="net">Сеть</button>
  <button class="filter-btn" data-filter="stor">Хранилище</button>
  <button class="filter-btn" data-filter="pm">Power</button>
  <button class="filter-btn" data-filter="usb">USB</button>
  <button class="filter-btn" data-filter="boot">Boot</button>
  <button class="filter-btn" data-filter="tpm">TPM</button>
  <button class="filter-btn" data-filter="pci">PCI/PCIe</button>
</div>

<div class="main">
  <div class="grid" id="grid"></div>
  <div class="no-results" id="noResults">Ничего не найдено</div>
</div>

    desc:"Драйвер CMOS RTC. Стандартные порты 0x70/0x71 для доступа к CMOS-регистрам, порт 0x80 — POST code port (diagnostic). Используется для хранения настроек BIOS (boot order, date/time, флаги POST). FUN_000c103c — обработка POST кодов.",

const TAG_MAP = {
  "pci":"tag-pci","PCIe":"tag-pci","PCI":"tag-pci",
  "usb":"tag-usb","USB":"tag-usb",
  "net":"tag-net","Network":"tag-net","HTTP":"tag-net","DHCP":"tag-net","DNS":"tag-net","TFTP":"tag-net","PXE":"tag-net",
  "sec":"tag-sec","SecureBoot":"tag-sec","TPM":"tag-sec",
  "pm":"tag-pm","Power":"tag-pm","ACPI":"tag-pm",
  "stor":"tag-stor","Block":"tag-stor","NVMe":"tag-stor","SPI":"tag-stor","SATA":"tag-stor",
  "boot":"tag-boot","Boot":"tag-boot","Device Path":"tag-boot",
  "amd":"tag-amd","AMD":"tag-amd","AGESA":"tag-amd",
  "ui":"tag-ui","Console":"tag-ui","Font":"tag-ui","HII":"tag-ui",
  "tpm":"tag-tpm","TCG":"tag-tpm","Crypto":"tag-tpm",
  "fw":"tag-fw","NVRAM":"tag-fw","Capsule":"tag-fw","CMOS":"tag-fw","RTC":"tag-fw",
  "misc":"tag-misc"
};

const TAG_LABEL = {
  "pci":"PCI","usb":"USB","net":"Сеть","sec":"SecureBoot","pm":"Power",
  "stor":"Storage","boot":"Boot","amd":"AMD/AGESA","ui":"UI","tpm":"TPM/TCG",
  "fw":"Firmware","misc":"Misc"
};

function makeTag(t) {
  const cls = TAG_MAP[t] || "tag-misc";
  return `<span class="tag ${cls}">${TAG_LABEL[t]||t}</span>`;
}

function renderCard(m) {
  const tags = m.tags.map(makeTag).join("");
  const funcs = m.bigFuncs.map(f => `
    <div class="func-item">
      <div class="func-addr">${f.addr}</div>
      <div class="func-info">
        <div class="func-sig">${f.name}</div>
        <div class="func-hints">${f.hints}</div>
      </div>
      <div class="func-size">${f.lines} ln</div>
    </div>
  `).join("");

  return `
  <div class="module-card" data-tags="${m.tags.join(",")}" data-text="${m.name} ${m.desc} ${m.bigFuncs.map(f=>f.name+f.hints).join(" ")}">
    <div class="card-header" onclick="toggle(this)">
      <div>
        <div class="module-addr">MODULE 0x${m.id.toUpperCase()}xxxx · ${m.addr}</div>
        <div class="module-name">${m.name}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span class="func-count">${m.funcs} fn</span>
        <span class="toggle-icon">▶</span>
      </div>
    </div>
    <div class="tags">${tags}</div>
    <div class="card-body">
      <hr class="section-sep">
      <div class="section-title">Описание</div>
      <div class="desc-text">${m.desc}</div>
      <div class="section-title">Ключевые функции</div>
      <div class="func-list">${funcs}</div>
    </div>
  </div>`;
}

const grid = document.getElementById("grid");
const noRes = document.getElementById("noResults");
grid.innerHTML = MODULES.map(renderCard).join("");

function toggle(header) {
  const body = header.nextElementSibling.nextElementSibling;
  const open = body.classList.toggle("open");
  header.classList.toggle("open", open);
}

let activeFilter = "all";

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById("search").addEventListener("input", applyFilters);

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase();
  let visible = 0;
  document.querySelectorAll(".module-card").forEach(card => {
    const tags = card.dataset.tags;
    const text = card.dataset.text.toLowerCase();
    const tagOk = activeFilter === "all" || tags.includes(activeFilter);
    const searchOk = !q || text.includes(q);
    const show = tagOk && searchOk;
    card.classList.toggle("hidden", !show);
    if(show) visible++;
  });
  noRes.style.display = visible === 0 ? "block" : "none";
}
</script>
